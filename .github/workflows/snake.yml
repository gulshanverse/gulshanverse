name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: gulshanverse
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Prepare activity graph output
        run: sudo rm -f activity-graph.svg

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: gulshanverse
          options: theme=tokyo-night&hide_border=true&radius=16
          output_path: activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy activity graph into output bundle
        run: sudo cp activity-graph.svg dist/activity-graph.svg

      - name: Push snake to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
